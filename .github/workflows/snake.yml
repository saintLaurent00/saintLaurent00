# ==========================================================
# 🐍 Workflow : animation serpent du graphique de contributions
# À placer dans : .github/workflows/snake.yml
# Version corrigée : permissions d'écriture + action à jour ✅
# ==========================================================
name: Generate Snake 🐍

on:
  schedule:
    - cron: "0 0 * * *"      # tous les jours à minuit (UTC)
  workflow_dispatch:          # permet de lancer manuellement

# ✅ C'est CECI qui répare l'erreur 128 :
# le robot GitHub reçoit le droit d'écrire dans le repo
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: saintLaurent00
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#F7B500&color_dots=#161b22,#1f2c1f,#2c5c1e,#4e9a06,#8fd460

      - name: Push snake to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: output
          force_orphan: true
